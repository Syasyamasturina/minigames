<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Try This - Mini Games</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
            touch-action: manipulation; /* Prevent double-tap zoom */
        }

        .view-container {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .view-container.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .pop-anim { animation: pop 0.2s ease-out; }
        .shake-anim { animation: shake 0.3s ease-out; }

        /* General Button Styles */
        .game-btn {
            transition: all 0.1s ease;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px rgba(0,0,0,0.2);
        }

        /* F1 Light Specific Overrides */
        .f1-circle {
            transition: background-color 0.1s ease, box-shadow 0.1s ease;
        }

        /* Memory Game Specifics */
        .perspective { perspective: 1000px; }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }
        .card.is-flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.5rem;
        }
        .card-front {
            background-color: #cbd5e1;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.5) 10px, rgba(255,255,255,0.5) 20px);
        }
        .card-back {
            background-color: white;
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #fcd34d;
        }
        
        @keyframes dropOff {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            40% { transform: translateY(-10px) scale(1.05); opacity: 1; }
            100% { transform: translateY(100px) scale(0.9); opacity: 0; visibility: hidden; }
        }
        
        .matched-drop {
            animation: dropOff 0.6s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
            pointer-events: none; /* Prevents clicks while dropping/hidden */
        }
        
        /* Hide scrollbar for nicer UI */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-2 sm:p-4">

    <main class="bg-white max-w-lg w-full rounded-[2rem] shadow-2xl overflow-hidden relative border-4 border-emerald-900 flex flex-col h-[90vh] max-h-[850px]">
        
        <!-- MAIN MENU -->
        <div id="menu-view" class="view-container active flex-col items-center justify-center h-full p-6 sm:p-8 flex-1 overflow-y-auto hide-scrollbar">
            <h1 class="text-5xl sm:text-6xl font-black text-emerald-600 mb-2 text-center drop-shadow-md tracking-tight">Try This</h1>
            <p class="text-gray-500 mb-10 text-center font-semibold text-lg">Test your brain & reflexes</p>

            <div class="w-full flex flex-col gap-5">
                <button onclick="openGame('reaction')" class="game-btn group relative w-full bg-rose-500 hover:bg-rose-400 text-white rounded-2xl p-6 text-left overflow-hidden border-2 border-rose-700">
                    <span class="relative z-10 block text-2xl font-black">1. Reaction Time</span>
                    <span class="relative z-10 block text-base opacity-90 mt-1">F1 Style Start Timer</span>
                    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-rose-600 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                </button>

                <button onclick="openGame('color')" class="game-btn group relative w-full bg-blue-500 hover:bg-blue-400 text-white rounded-2xl p-6 text-left overflow-hidden border-2 border-blue-700">
                    <span class="relative z-10 block text-2xl font-black">2. Colour Match</span>
                    <span class="relative z-10 block text-base opacity-90 mt-1">Match the colour, not the word!</span>
                    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-blue-600 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                </button>

                <button onclick="openGame('memory')" class="game-btn group relative w-full bg-amber-500 hover:bg-amber-400 text-white rounded-2xl p-6 text-left overflow-hidden border-2 border-amber-700">
                    <span class="relative z-10 block text-2xl font-black">3. Memory Match</span>
                    <span class="relative z-10 block text-base opacity-90 mt-1">12 Pairs of Local Cuisines</span>
                    <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-amber-600 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                </button>
            </div>
        </div>

        <!-- REACTION TIMER GAME -->
        <div id="reaction-view" class="view-container flex-col h-full flex-1">
            <div class="bg-rose-500 text-white p-4 flex items-center justify-between border-b-4 border-rose-700">
                <button onclick="backToMenu()" class="font-bold hover:bg-rose-600 px-3 py-2 rounded-lg transition-colors bg-rose-800/30">← Back</button>
                <h2 class="text-xl sm:text-2xl font-black truncate mx-2">Reaction Time</h2>
                <div class="w-16 text-right text-[10px] sm:text-xs font-bold uppercase tracking-wider opacity-90">Best<br><span id="reaction-best" class="text-sm sm:text-base text-white">--</span></div>
            </div>
            
            <div class="flex-1 flex flex-col items-center justify-center p-4 bg-slate-50 text-gray-900 relative">
                <!-- F1 Traffic Light Array -->
                <div class="relative flex items-center justify-center mb-10 px-2 py-4 scale-[0.75] sm:scale-100">
                    <!-- Horizontal center line crossing all columns -->
                    <div class="absolute top-1/2 left-0 w-full h-3 bg-[#111] z-20 -translate-y-1/2 rounded-full shadow-md"></div>
                    
                    <div class="flex gap-2 relative z-10">
                        <!-- 5 Columns x 2 Lights -->
                        <div id="f1-col-1" class="flex flex-col gap-2 bg-[#111] p-3 rounded-xl border border-black shadow-2xl">
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                        </div>
                        <div id="f1-col-2" class="flex flex-col gap-2 bg-[#111] p-3 rounded-xl border border-black shadow-2xl">
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                        </div>
                        <div id="f1-col-3" class="flex flex-col gap-2 bg-[#111] p-3 rounded-xl border border-black shadow-2xl">
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                        </div>
                        <div id="f1-col-4" class="flex flex-col gap-2 bg-[#111] p-3 rounded-xl border border-black shadow-2xl">
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                        </div>
                        <div id="f1-col-5" class="flex flex-col gap-2 bg-[#111] p-3 rounded-xl border border-black shadow-2xl">
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                            <div class="f1-circle w-12 h-12 rounded-full bg-zinc-800 shadow-inner"></div>
                        </div>
                    </div>
                </div>

                <div id="reaction-result" class="text-5xl sm:text-6xl font-black mb-8 h-16 text-black font-mono tabular-nums tracking-tighter transition-colors">
                    00.000
                </div>

                <button id="reaction-action-btn" onmousedown="handleReactionClick()" ontouchstart="handleReactionClick(); event.preventDefault();" class="game-btn w-full max-w-[320px] bg-blue-500 text-white text-2xl sm:text-3xl font-black py-5 sm:py-6 rounded-2xl border-4 border-blue-700 select-none">
                    START
                </button>
            </div>
        </div>

        <!-- COLOR WORD TEST -->
        <div id="color-view" class="view-container flex-col h-full flex-1 bg-slate-50">
            <div class="bg-blue-500 text-white p-4 flex items-center justify-between border-b-4 border-blue-700 shadow-sm z-10">
                <button onclick="backToMenu()" class="font-bold hover:bg-blue-600 px-3 py-2 rounded-lg transition-colors bg-blue-800/30">← Back</button>
                <div class="flex flex-col items-center">
                    <h2 class="text-xl sm:text-2xl font-black">Colour Match</h2>
                    <div class="text-xs sm:text-sm font-bold bg-blue-800 px-3 py-0.5 rounded-full mt-1">⏳ <span id="color-time">30</span>s</div>
                </div>
                <div class="font-bold text-lg bg-blue-700 px-3 py-1 rounded-full shadow-inner">🔥 <span id="color-score">0</span></div>
            </div>

            <!-- GAME AREA -->
            <div id="color-game-area" class="flex-1 flex flex-col items-center p-6 justify-between">
                <div class="text-center mt-2">
                    <p class="text-gray-500 font-bold mb-2 uppercase tracking-wide text-xs sm:text-sm">Select the actual text colour!</p>
                </div>

                <div class="flex-1 flex items-center justify-center w-full min-h-[120px]">
                    <div id="color-word-display" class="text-6xl sm:text-8xl font-black tracking-tighter drop-shadow-md capitalize transition-transform duration-200">
                        Word
                    </div>
                </div>

                <div id="color-options-grid" class="grid grid-cols-2 gap-3 sm:gap-4 w-full max-w-sm mb-4">
                    <!-- Buttons generated by JS -->
                </div>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="color-game-over" class="hidden flex-1 flex-col items-center justify-center p-6 bg-slate-50">
                <h3 class="text-5xl font-black text-blue-600 mb-2 drop-shadow-sm text-center">Time's Up!</h3>
                <p class="text-2xl text-slate-600 font-bold mb-8">Final Score: <span id="color-final-score" class="text-4xl text-blue-500">0</span></p>
                <div class="flex flex-col sm:flex-row gap-4 w-full max-w-sm">
                    <button onclick="initColorGame()" class="flex-1 game-btn bg-blue-500 hover:bg-blue-400 text-white font-bold text-xl py-4 rounded-xl border-b-4 border-blue-700">Play Again</button>
                    <button onclick="backToMenu()" class="flex-1 game-btn bg-slate-300 hover:bg-slate-200 text-slate-700 font-bold text-xl py-4 rounded-xl border-b-4 border-slate-500">Menu</button>
                </div>
            </div>
        </div>

        <!-- MEMORY MATCH -->
        <div id="memory-view" class="view-container flex-col h-full flex-1 bg-amber-50">
            <div class="bg-amber-500 text-white p-4 flex items-center justify-between border-b-4 border-amber-700 shadow-sm z-20">
                <button onclick="backToMenu()" class="font-bold hover:bg-amber-600 px-3 py-2 rounded-lg transition-colors bg-amber-800/30">← Back</button>
                <div class="flex flex-col items-center">
                    <h2 class="text-xl sm:text-2xl font-black">Memory Match</h2>
                    <div class="text-xs sm:text-sm font-bold bg-amber-700 px-3 py-0.5 rounded-full mt-1">⏳ <span id="memory-time">60</span>s</div>
                </div>
                <div class="font-bold text-base sm:text-lg bg-amber-700 px-3 py-1 rounded-full shadow-inner flex items-center gap-1">
                    <span>⭐</span> <span id="memory-score">0</span><span class="text-xs sm:text-sm opacity-80">/12</span>
                </div>
            </div>

            <!-- GAME AREA (Scrollable to accommodate 24 cards securely on small screens) -->
            <div id="memory-game-area" class="flex-1 overflow-y-auto hide-scrollbar flex flex-col items-center p-3 sm:p-4">
                <p class="text-gray-500 font-bold mb-3 uppercase tracking-wide text-[10px] sm:text-xs">Match the 12 local cuisines!</p>
                
                <!-- Grid container: 4 cols by 6 rows. 
                     Wrappers maintain aspect-ratio square, ensuring cards drop but layout stays intact -->
                <div id="memory-grid" class="grid grid-cols-4 gap-2 sm:gap-3 w-full max-w-[400px] mb-6">
                    <!-- Cards injected by JS -->
                </div>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="memory-game-over" class="hidden flex-1 flex-col items-center justify-center p-6 bg-amber-50 z-30">
                <h3 id="memory-end-title" class="text-5xl font-black text-amber-600 mb-2 drop-shadow-sm text-center">Time's Up!</h3>
                <p class="text-xl sm:text-2xl text-slate-600 font-bold mb-8">Pairs Matched: <span id="memory-final-score" class="text-4xl text-amber-500">0</span></p>
                <div class="flex flex-col sm:flex-row gap-4 w-full max-w-sm">
                    <button onclick="initMemoryGame()" class="flex-1 game-btn bg-amber-500 hover:bg-amber-400 text-white font-bold text-xl py-4 rounded-xl border-b-4 border-amber-700">Play Again</button>
                    <button onclick="backToMenu()" class="flex-1 game-btn bg-slate-300 hover:bg-slate-200 text-slate-700 font-bold text-xl py-4 rounded-xl border-b-4 border-slate-500">Menu</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        /* --- GLOBAL LOGIC --- */
        let currentGame = null;
        let colorTimerInterval = null;
        let memoryTimerInterval = null;

        function openGame(gameId) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.getElementById(gameId + '-view').classList.add('active');
            currentGame = gameId;

            if (gameId === 'reaction') initReactionGame();
            if (gameId === 'color') initColorGame();
            if (gameId === 'memory') initMemoryGame();
        }

        function backToMenu() {
            if (currentGame === 'reaction') cleanupReactionGame();
            if (colorTimerInterval) clearInterval(colorTimerInterval);
            if (memoryTimerInterval) clearInterval(memoryTimerInterval);
            
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.getElementById('menu-view').classList.add('active');
            currentGame = null;
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        /* --- REACTION TIME (F1 STYLE) --- */
        let reactionState = 'idle'; // idle, sequencing, waiting, ready
        let f1SequenceInterval = null;
        let f1OffTimeout = null;
        let liveTimerInterval = null;
        let reactionStartTime = 0;
        let bestReactionTime = localStorage.getItem('tryThis_bestReaction') || Infinity;

        const rBtn = document.getElementById('reaction-action-btn');
        const rResult = document.getElementById('reaction-result');
        const rBest = document.getElementById('reaction-best');

        function updateBestTimeDisplay() {
            if (bestReactionTime < Infinity) {
                rBest.innerText = (bestReactionTime / 1000).toFixed(3);
            }
        }

        function initReactionGame() {
            cleanupReactionGame();
            resetF1Lights();
            updateBestTimeDisplay();
            rResult.innerText = "00.000";
            rResult.classList.remove('text-rose-600', 'text-green-600');
            rResult.classList.add('text-black');
            
            rBtn.innerText = "START";
            rBtn.className = "game-btn w-full max-w-[320px] bg-blue-500 text-white text-2xl sm:text-3xl font-black py-5 sm:py-6 rounded-2xl border-4 border-blue-700 select-none";
            reactionState = 'idle';
        }

        function cleanupReactionGame() {
            clearInterval(f1SequenceInterval);
            clearTimeout(f1OffTimeout);
            if (liveTimerInterval) cancelAnimationFrame(liveTimerInterval);
        }

        function resetF1Lights() {
            document.querySelectorAll('.f1-circle').forEach(light => {
                light.classList.remove('bg-red-600', 'shadow-[0_0_20px_#dc2626]');
                light.classList.add('bg-zinc-800');
            });
        }

        function setF1ColumnRed(colIndex) {
            const col = document.getElementById(`f1-col-${colIndex}`);
            if(col) {
                const lights = col.querySelectorAll('.f1-circle');
                lights.forEach(light => {
                    light.classList.remove('bg-zinc-800');
                    light.classList.add('bg-red-600', 'shadow-[0_0_20px_#dc2626]');
                });
            }
        }

        function startLiveTimer() {
            function updateTimer() {
                if (reactionState === 'ready') {
                    const ms = performance.now() - reactionStartTime;
                    rResult.innerText = (ms / 1000).toFixed(3).padStart(6, '0');
                    liveTimerInterval = requestAnimationFrame(updateTimer);
                }
            }
            liveTimerInterval = requestAnimationFrame(updateTimer);
        }

        function handleReactionClick() {
            if (reactionState === 'idle') {
                // Start F1 light sequence
                reactionState = 'sequencing';
                rBtn.innerText = "WAIT...";
                rBtn.className = "game-btn w-full max-w-[320px] bg-amber-500 text-white text-2xl sm:text-3xl font-black py-5 sm:py-6 rounded-2xl border-4 border-amber-700 select-none";
                rResult.innerText = "00.000";
                rResult.classList.remove('text-rose-600', 'text-green-600');
                rResult.classList.add('text-black');
                resetF1Lights();

                let col = 1;
                f1SequenceInterval = setInterval(() => {
                    setF1ColumnRed(col);
                    col++;
                    if (col > 5) {
                        clearInterval(f1SequenceInterval);
                        reactionState = 'waiting';
                        
                        // Random delay between 1s and 3s before lights go out
                        const delay = Math.random() * 2000 + 1000;
                        
                        f1OffTimeout = setTimeout(() => {
                            resetF1Lights(); // Lights OUT!
                            reactionState = 'ready';
                            reactionStartTime = performance.now();
                            
                            rBtn.innerText = "CLICK!";
                            rBtn.className = "game-btn w-full max-w-[320px] bg-green-500 text-white text-2xl sm:text-3xl font-black py-5 sm:py-6 rounded-2xl border-4 border-green-700 pop-anim select-none";
                            
                            startLiveTimer();

                        }, delay);
                    }
                }, 1000);

            } else if (reactionState === 'sequencing' || reactionState === 'waiting') {
                // Clicked too early penalty
                cleanupReactionGame();
                resetF1Lights();
                reactionState = 'idle';
                
                rResult.innerText = "JUMP START!";
                rResult.classList.add('text-rose-600', 'shake-anim');
                rResult.classList.remove('text-black');
                
                rBtn.innerText = "TRY AGAIN";
                rBtn.className = "game-btn w-full max-w-[320px] bg-rose-500 text-white text-2xl sm:text-3xl font-black py-5 sm:py-6 rounded-2xl border-4 border-rose-700 select-none";
                
                setTimeout(() => rResult.classList.remove('shake-anim'), 400);

            } else if (reactionState === 'ready') {
                // Successful click
                cleanupReactionGame(); // Stop live timer loop
                const finalTime = performance.now() - reactionStartTime;
                reactionState = 'idle';
                
                if (finalTime < bestReactionTime) {
                    bestReactionTime = finalTime;
                    localStorage.setItem('tryThis_bestReaction', bestReactionTime);
                    updateBestTimeDisplay();
                }

                rResult.innerText = (finalTime / 1000).toFixed(3).padStart(6, '0');
                rResult.classList.add('text-green-600', 'pop-anim');
                rResult.classList.remove('text-black');
                
                rBtn.innerText = "PLAY AGAIN";
                rBtn.className = "game-btn w-full max-w-[320px] bg-blue-500 text-white text-2xl sm:text-3xl font-black py-5 sm:py-6 rounded-2xl border-4 border-blue-700 select-none";
                
                setTimeout(() => rResult.classList.remove('pop-anim'), 300);
            }
        }

        /* --- COLOUR MATCH LOGIC --- */
        const colors = [
            { name: 'Red', hex: '#ef4444' },
            { name: 'Blue', hex: '#3b82f6' },
            { name: 'Green', hex: '#22c55e' },
            { name: 'Yellow', hex: '#eab308' },
            { name: 'Purple', hex: '#a855f7' },
            { name: 'Orange', hex: '#f97316' },
            { name: 'Pink', hex: '#ec4899' },
            { name: 'Black', hex: '#1e293b' }
        ];

        let colorScore = 0;
        let currentColorTarget = null;
        let colorTimeLeft = 30;

        const wordDisplay = document.getElementById('color-word-display');
        const colorOptionsGrid = document.getElementById('color-options-grid');
        const colorScoreDisplay = document.getElementById('color-score');

        function initColorGame() {
            colorScore = 0;
            colorTimeLeft = 30;
            colorScoreDisplay.innerText = colorScore;
            document.getElementById('color-time').innerText = colorTimeLeft;
            
            document.getElementById('color-game-over').classList.add('hidden');
            document.getElementById('color-game-over').classList.remove('flex');

            clearInterval(colorTimerInterval);
            colorTimerInterval = setInterval(() => {
                colorTimeLeft--;
                document.getElementById('color-time').innerText = colorTimeLeft;
                if (colorTimeLeft <= 0) {
                    endColorGame();
                }
            }, 1000);

            nextColorRound();
        }

        function endColorGame() {
            clearInterval(colorTimerInterval);
            const gameOverScreen = document.getElementById('color-game-over');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
            document.getElementById('color-final-score').innerText = colorScore;
        }

        function nextColorRound() {
            wordDisplay.classList.remove('pop-anim');
            void wordDisplay.offsetWidth; 
            wordDisplay.classList.add('pop-anim');

            const textWordIndex = Math.floor(Math.random() * colors.length);
            let textColorIndex = Math.floor(Math.random() * colors.length);
            
            if (textWordIndex === textColorIndex) {
                textColorIndex = (textColorIndex + 1) % colors.length;
            }

            const wordObj = colors[textWordIndex];
            const colorObj = colors[textColorIndex];

            wordDisplay.innerText = wordObj.name;
            wordDisplay.style.color = colorObj.hex;
            currentColorTarget = colorObj.name; 

            let options = [colorObj.name];
            let availableColors = colors.map(c => c.name).filter(n => n !== colorObj.name);
            availableColors = shuffle(availableColors);
            
            options.push(availableColors[0], availableColors[1], availableColors[2]);
            options = shuffle(options);

            colorOptionsGrid.innerHTML = '';
            options.forEach(optName => {
                const btn = document.createElement('button');
                btn.className = "game-btn bg-white text-gray-800 font-bold text-xl sm:text-2xl py-4 sm:py-5 rounded-2xl border-4 border-blue-200 hover:bg-blue-50 active:bg-blue-100 select-none";
                btn.innerText = optName;
                btn.onclick = () => {
                    if (colorTimeLeft <= 0) return;
                    
                    if (optName === currentColorTarget) {
                        colorScore++;
                        colorScoreDisplay.innerText = colorScore;
                        btn.classList.add('bg-green-100', 'border-green-400');
                        setTimeout(nextColorRound, 150);
                    } else {
                        colorScore = Math.max(0, colorScore - 1); // Optional: penalty for wrong
                        colorScoreDisplay.innerText = colorScore;
                        btn.classList.add('bg-red-100', 'border-red-400');
                        wordDisplay.classList.add('shake-anim');
                        setTimeout(() => {
                            wordDisplay.classList.remove('shake-anim');
                            nextColorRound();
                        }, 400);
                    }
                };
                colorOptionsGrid.appendChild(btn);
            });
        }

        /* --- MEMORY MATCH LOGIC (12 PAIRS) --- */
        const cuisines = [
            { id: 1, emoji: '🥥', name: 'Nasi Lemak' },
            { id: 2, emoji: '🍢', name: 'Satay' },
            { id: 3, emoji: '🍜', name: 'Laksa' },
            { id: 4, emoji: '🫓', name: 'Roti Canai' },
            { id: 5, emoji: '☕', name: 'Teh Tarik' },
            { id: 6, emoji: '🍈', name: 'Durian' },
            { id: 7, emoji: '🍘', name: 'Ketupat' },
            { id: 8, emoji: '🍧', name: 'Cendol' },
            { id: 9, emoji: '🍤', name: 'Kway Teow' },
            { id: 10, emoji: '🍗', name: 'Chicken Rice' },
            { id: 11, emoji: '🍛', name: 'Rendang' },
            { id: 12, emoji: '🥤', name: 'Ais Kacang' }
        ];

        let memoryScore = 0;
        let memoryTimeLeft = 60;
        let flippedCards = [];
        let lockBoard = false;

        const memoryGrid = document.getElementById('memory-grid');
        const memoryScoreDisplay = document.getElementById('memory-score');
        const memoryGameArea = document.getElementById('memory-game-area');

        function initMemoryGame() {
            memoryScore = 0;
            memoryTimeLeft = 60;
            flippedCards = [];
            lockBoard = false;
            
            memoryScoreDisplay.innerText = memoryScore;
            document.getElementById('memory-time').innerText = memoryTimeLeft;
            
            // Show Game Area, Hide Game Over
            memoryGameArea.classList.remove('hidden');
            memoryGameArea.classList.add('flex');
            document.getElementById('memory-game-over').classList.add('hidden');
            document.getElementById('memory-game-over').classList.remove('flex');
            
            // Scroll to top of game area
            memoryGameArea.scrollTop = 0;

            // Set up board with 24 cards (12 pairs)
            createMemoryBoard();

            // Timer Logic
            clearInterval(memoryTimerInterval);
            memoryTimerInterval = setInterval(() => {
                memoryTimeLeft--;
                document.getElementById('memory-time').innerText = memoryTimeLeft;
                if (memoryTimeLeft <= 0) {
                    endMemoryGame(false);
                }
            }, 1000);
        }

        function createMemoryBoard() {
            memoryGrid.innerHTML = '';
            
            // Duplicate the 12 items to make 24 cards, then shuffle
            let gameDeck = [...cuisines, ...cuisines];
            gameDeck = shuffle(gameDeck);

            gameDeck.forEach((item) => {
                // The wrapper remains in the grid cell even when the card drops, preserving layout and gap.
                const wrapper = document.createElement('div');
                wrapper.className = "aspect-square w-full"; 

                const card = document.createElement('div');
                card.className = "card w-full h-full cursor-pointer perspective";
                card.dataset.id = item.id;
                
                const inner = document.createElement('div');
                inner.className = "card-inner shadow-sm sm:shadow-md rounded-[0.5rem]";

                const front = document.createElement('div');
                front.className = "card-front border sm:border-2 border-slate-300";
                
                const back = document.createElement('div');
                back.className = "card-back shadow-inner";
                // Adjust text sizes so they fit nicely in a tighter 4x6 mobile grid
                back.innerHTML = `<div class="text-2xl sm:text-3xl drop-shadow-sm">${item.emoji}</div><div class="text-[0.55rem] sm:text-[0.65rem] font-black mt-1 text-center leading-tight text-amber-900 px-1 truncate w-full">${item.name}</div>`;

                inner.appendChild(front);
                inner.appendChild(back);
                card.appendChild(inner);

                card.addEventListener('click', () => flipCard(card));

                wrapper.appendChild(card);
                memoryGrid.appendChild(wrapper);
            });
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card === flippedCards[0]) return;
            if (card.classList.contains('matched')) return;

            card.classList.add('is-flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            let isMatch = flippedCards[0].dataset.id === flippedCards[1].dataset.id;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            lockBoard = true;
            memoryScore++;
            memoryScoreDisplay.innerText = memoryScore;

            setTimeout(() => {
                // Apply the drop animation to the matched cards' inner container so they fall down
                // The wrapper keeps the slot open.
                flippedCards[0].classList.add('matched');
                flippedCards[1].classList.add('matched');
                
                flippedCards[0].querySelector('.card-inner').classList.add('matched-drop');
                flippedCards[1].querySelector('.card-inner').classList.add('matched-drop');
                
                resetBoard();

                if (memoryScore === 12) {
                    setTimeout(() => endMemoryGame(true), 600); // Wait for the drop animation to finish
                }
            }, 600); // Brief pause to see the match before they drop
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                flippedCards[0].classList.remove('is-flipped');
                flippedCards[1].classList.remove('is-flipped');
                resetBoard();
            }, 1000); // 1-second penalty before unflipping
        }

        function resetBoard() {
            [flippedCards, lockBoard] = [[], false];
        }

        function endMemoryGame(isWin) {
            clearInterval(memoryTimerInterval);
            memoryGameArea.classList.add('hidden');
            memoryGameArea.classList.remove('flex');
            
            const gameOverScreen = document.getElementById('memory-game-over');
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
            
            document.getElementById('memory-end-title').innerText = isWin ? "You Win!" : "Time's Up!";
            document.getElementById('memory-final-score').innerText = memoryScore;
        }
    </script>
</body>
</html>
